<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">统一测评流程</title>
  <desc id="desc">同一公司简报、财务假设和交付要求分别输入三款办公 Agent，生成六项交付物并按 A、B、C 三级证据记录结论。</desc>

  <rect width="1200" height="360" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#d8dee8"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="52" y="58" fill="#111318" font-size="34" font-weight="720">同题、同输入、一次运行</text>
    <text x="52" y="88" fill="#5b6573" font-size="18">统一任务用于暴露交付、权限、稳定性和生态写回差异，不合成产品总分。</text>
  </g>

  <g transform="translate(52 124)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g id="input">
      <text x="0" y="0" fill="#0a67d1" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17">01 · UNIFIED INPUT</text>
      <rect x="0" y="20" width="232" height="158" rx="12" fill="#f7f8fa" stroke="#d8dee8"/>
      <text x="22" y="58" fill="#111318" font-size="22" font-weight="700">统一输入</text>
      <text x="22" y="91" fill="#5b6573" font-size="18">公司简报</text>
      <text x="22" y="120" fill="#5b6573" font-size="18">财务假设</text>
      <text x="22" y="149" fill="#5b6573" font-size="18">交付要求</text>
    </g>

    <path d="M250 99H306" stroke="#0a67d1" stroke-width="2"/>
    <path d="M296 91L306 99L296 107" fill="none" stroke="#0a67d1" stroke-width="2"/>

    <g id="agents" transform="translate(324 0)">
      <text x="0" y="0" fill="#0a67d1" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17">02 · THREE AGENTS</text>
      <rect x="0" y="20" width="252" height="44" rx="9" fill="#f7f8fa" stroke="#d8dee8"/>
      <rect x="0" y="77" width="252" height="44" rx="9" fill="#f7f8fa" stroke="#d8dee8"/>
      <rect x="0" y="134" width="252" height="44" rx="9" fill="#f7f8fa" stroke="#d8dee8"/>
      <circle cx="22" cy="42" r="6" fill="#0a67d1"/>
      <circle cx="22" cy="99" r="6" fill="#19a66a"/>
      <circle cx="22" cy="156" r="6" fill="#111318"/>
      <text x="40" y="49" fill="#111318" font-size="18" font-weight="650">飞书 + 豆包工作</text>
      <text x="40" y="106" fill="#111318" font-size="18" font-weight="650">企业微信 + WorkBuddy</text>
      <text x="40" y="163" fill="#111318" font-size="18" font-weight="650">钉钉 + 千问办公</text>
    </g>

    <path d="M594 99H650" stroke="#0a67d1" stroke-width="2"/>
    <path d="M640 91L650 99L640 107" fill="none" stroke="#0a67d1" stroke-width="2"/>

    <g id="outputs" transform="translate(668 0)">
      <text x="0" y="0" fill="#0a67d1" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17">03 · SIX DELIVERABLES</text>
      <rect x="0" y="20" width="232" height="158" rx="12" fill="#f7f8fa" stroke="#d8dee8"/>
      <text x="22" y="58" fill="#111318" font-size="22" font-weight="700">六项交付物</text>
      <text x="22" y="91" fill="#5b6573" font-size="18">XLSX · CSV · PPTX</text>
      <text x="22" y="120" fill="#5b6573" font-size="18">来源日志</text>
      <text x="22" y="149" fill="#5b6573" font-size="18">运行与协同记录</text>
    </g>

    <path d="M918 99H966" stroke="#0a67d1" stroke-width="2"/>
    <path d="M956 91L966 99L956 107" fill="none" stroke="#0a67d1" stroke-width="2"/>

    <g id="evidence" transform="translate(984 0)">
      <text x="0" y="0" fill="#0a67d1" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17">04 · EVIDENCE</text>
      <rect x="0" y="20" width="164" height="158" rx="12" fill="#111318"/>
      <text x="20" y="58" fill="#ffffff" font-size="20" font-weight="700">A</text>
      <text x="54" y="58" fill="#c9d0da" font-size="17">官方 / 实测</text>
      <text x="20" y="101" fill="#ffffff" font-size="20" font-weight="700">B</text>
      <text x="54" y="101" fill="#c9d0da" font-size="17">媒体 / 案例</text>
      <text x="20" y="144" fill="#ffffff" font-size="20" font-weight="700">C</text>
      <text x="54" y="144" fill="#c9d0da" font-size="17">社区记录</text>
    </g>
  </g>

  <g transform="translate(52 326)" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16">
    <circle cx="6" cy="-5" r="6" fill="#19a66a"/>
    <text x="22" y="0" fill="#111318">结果可解析</text>
    <text x="142" y="0" fill="#6a7481">/</text>
    <text x="164" y="0" fill="#111318">失败如实记录</text>
    <text x="316" y="0" fill="#6a7481">/</text>
    <text x="338" y="0" fill="#111318">单次运行不外推长期稳定性</text>
  </g>
</svg>
